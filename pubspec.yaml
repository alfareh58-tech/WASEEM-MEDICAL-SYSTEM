name: waseem_medical_pro
description: نظام وسيم الطبي PRO - نظام طبي وإداري ومحاسبي متكامل.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # أيقونات iOS
  cupertino_icons: ^1.0.8

  # قاعدة البيانات
  sqflite: ^2.4.2
  sqflite_common_ffi_web: ^1.0.2
  path: ^1.9.1

  # التاريخ واللغة العربية
  intl: ^0.19.0

  # فتح الروابط وواتساب العادي
  url_launcher: ^6.3.1

  # إنشاء ملفات PDF
  pdf: ^3.11.3

  # الطباعة ومشاركة PDF
  printing: ^5.14.2

  # حفظ إعدادات التطبيق
  shared_preferences: ^2.5.3

  # اختيار شعار المركز من الهاتف
  image_picker: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
